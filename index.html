<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Login | Sistema de Tickets</title>
  <link rel="stylesheet" href="styles.css?v=16" />
</head>
<body>
  <div class="login-container">
    <div class="login-left">
      <img src="pictures/imagen_02.jpg" alt="Imagen principal" class="login-image" />
    </div>

    <div class="login-right">
      <div class="login-box">
        <h1>Bienvenido</h1>

        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="Ingresa tu correo" />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" />
          </div>

          <p class="forgot-password" id="btnLoginCambiarPassword">Cambiar contraseña</p>

          <button type="submit" class="btn-login">Iniciar sesión</button>

          <p id="mensaje" class="mensaje"></p>
        </form>
      </div>
    </div>
  </div>

  <div class="login-modal-overlay hidden" id="loginPasswordModal">
    <div class="login-password-card">
      <button class="login-modal-close" id="btnCerrarLoginPassword" type="button">×</button>
      <h3>Cambiar contraseña</h3>
      <p>Ingresa tu correo, contraseña actual y nueva contraseña.</p>
      <div class="form-group">
        <label for="changeEmail">Correo electrónico</label>
        <input type="email" id="changeEmail" placeholder="correo@empresa.com" />
      </div>
      <div class="form-group">
        <label for="changeOldPassword">Contraseña actual</label>
        <input type="password" id="changeOldPassword" placeholder="Contraseña actual" />
      </div>
      <div class="form-group">
        <label for="changeNewPassword">Nueva contraseña</label>
        <input type="password" id="changeNewPassword" placeholder="Nueva contraseña" />
      </div>
      <div class="form-group">
        <label for="changeNewPassword2">Repite nueva contraseña</label>
        <input type="password" id="changeNewPassword2" placeholder="Repite la nueva contraseña" />
      </div>
      <p id="changePasswordMsg" class="mensaje"></p>
      <button type="button" class="btn-login" id="btnGuardarLoginPassword">Guardar contraseña</button>
    </div>
  </div>

  <script src="app.js?v=16"></script>
</body>
</html>
